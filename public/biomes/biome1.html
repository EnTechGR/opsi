<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A-Frame Spheres with Hover Tooltips</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A-Frame library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      // Self-rotate component
      AFRAME.registerComponent('self-rotate', {
        schema: { speed: { type: 'number', default: 0.5 } },
        tick: function (time, timeDelta) {
          const rotation = this.el.object3D.rotation;
          rotation.y += this.data.speed * (timeDelta / 1000);
        },
      });

      // Toggle-visibility-on-click component
      AFRAME.registerComponent('toggle-visibility-on-click', {
        schema: { target: { type: 'selector' } },
        init: function () {
          const sphereEl = this.el;
          const targetEl = this.data.target;
          sphereEl.addEventListener('click', () => {
            const isVisible = targetEl.getAttribute('visible');
            targetEl.setAttribute('visible', !isVisible);
          });
        },
      });

      // Play/pause video component
      AFRAME.registerComponent('play-pause-video-on-click', {
        schema: { target: { type: 'selector' } },
        init: function () {
          let playing = false;
          const videoEl = this.data.target;
          this.el.addEventListener('click', () => {
            if (!playing) {
              videoEl.play();
              playing = true;
            } else {
              videoEl.pause();
              playing = false;
            }
          });
        },
      });

      // Show-text-on-hover component
      AFRAME.registerComponent('show-text-on-hover', {
        schema: {
          target: { type: 'selector' },
        },
        init: function () {
          const sphereEl = this.el;
          const textEl = this.data.target;

          sphereEl.addEventListener('mouseenter', () => {
            textEl.setAttribute('visible', true);
          });

          sphereEl.addEventListener('mouseleave', () => {
            textEl.setAttribute('visible', false);
          });
        },
      });
    </script>
  </head>

  <body>
    <a-scene>
      <!-- ASSETS -->
      <a-assets>
        <video
          id="myVideo"
          src="video1.mp4"
          loop
          unmuted
          playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <!-- Sky -->
      <a-sky src="../textures/skybiome101.jpg" rotation="0 -130 0"></a-sky>

      <!-- Cursor -->
      <a-entity
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable, .hoverable"
        position="0 1.6 0"
      ></a-entity>

      <!-- Sphere 1 with video popup -->
      <a-sphere
      id="sphere1"
      self-rotate="speed: 0.5"
      material="src: ../textures/planetexmp1.jpg"
      class="clickable hoverable"
      radius="0.3"
      position="-1.5 1.5 -3"
      toggle-visibility-on-click="target: #infoPlane"
      show-text-on-hover="target: #text1"
    ></a-sphere>

      <!-- Sphere 1's hover text -->
      <a-text
        id="text1"
        value="Hello from Sphere 1!"
        color="white"
        align="center"
        visible="false"
        position="-1.5 2 -3" 
      ></a-text>

      <!-- Info Plane -->
      <a-plane
        id="infoPlane"
        visible="false"
        position="-3.5 0.6 -2.5" 
        rotation="0 55 0"
        width="3"
        height="2"
        color="#FFFFFF"
        material="opacity: 0.8"
      >

      <!-- Video plane -->
      <a-plane 
      id="videoPlane" 
      position="0 0 0.01" 
      width="1.78" 
      height="1"
      scale="1.7 2 1"
      material="shader: flat; src: #myVideo">
      </a-plane>

        <!-- Play/Pause Button -->
        <a-plane
          id="playButton"
          class="clickable"
          position="0 1.1 0.02"
          width="0.5"
          height="0.2"
          material="color: green"
          play-pause-video-on-click="target: #myVideo"
        >
          <a-text
            value="Play/Pause"
            color="#FFFFFF"
            align="center"
            width="0.9"
            position="0 0 0.01"
          ></a-text>
        </a-plane>
      </a-plane>

      <!-- Sphere 2 -->
      <a-sphere
      id="sphere2"
      self-rotate="speed: 0.5"
      material="src: ../textures/planetexmp2.jpg"
      class="hoverable"
      radius="0.3"
      position="1.5 1.5 -3" 
      show-text-on-hover="target: #text2"
    ></a-sphere>
      <!-- Sphere 2's hover text -->
      <a-text
        id="text2"
        value="ΓΛΩΣΣΑΣ ΓΛΩΣΣΟΛΟΓΙΑΣ"
        font="custom-msdf.json"
        color="white"
        negate="false"
        align="center"
        visible="false"
        position="1.5 2 -3"
      ></a-text>

      <!-- Sphere 3 -->
      <a-sphere
      id="sphere3"
      self-rotate="speed: 0.5"
      material="src: ../textures/planetexmp3.jpg"
      class="hoverable"
      radius="0.3"
      position="-1.5 -0.5 -3" 
      show-text-on-hover="target: #text3"
    ></a-sphere>
      <!-- Sphere 3's hover text -->
      <a-text
        id="text3"
        value="ΛΟΓΟΤΕΧΝΙΑΣ ΠΟΛΙΤΙΣΜΟΥ"
        font="custom-msdf.json"
        negate="false"
        color="white"
        align="center"
        visible="false"
        position="-1.5 0 -3"
      ></a-text>
      
      <a-sphere
  id="sphere4"
  self-rotate="speed: 0.5"
  material="src: ../textures/planetexmp1.jpg"
  class="hoverable"
  radius="0.3"
  position="1.5 -0.5 -3" 
  show-text-on-hover="target: #text4"
></a-sphere>
<a-text
        id="text4"
        value="Τεστ"
        font="custom-msdf.json"
        negate="false"
        color="white"
        align="center"
        visible="false"
        position="1.5 0 -3" 
        ></a-text>
      <!-- Lines connecting the spheres -->
      <a-entity line="start: -1.5 1.5 -3; end: 1.5 1.5 -3; color: white"></a-entity>
<a-entity line="start: 1.5 1.5 -3; end: 1.5 -0.5 -3; color: white"></a-entity>
<a-entity line="start: 1.5 -0.5 -3; end: -1.5 -0.5 -3; color: white"></a-entity>
<a-entity line="start: -1.5 -0.5 -3; end: -1.5 1.5 -3; color: white"></a-entity>
    </a-scene>
  </body>
</html>
