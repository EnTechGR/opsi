<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Biome 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script src="../javascripts/bundle.js"></script>
  <script src="../node_modules/aframe-inspector/dist/aframe-inspector.min.js"></script>
  <script>
    // Existing components...
    AFRAME.registerComponent('self-rotate', {
      schema: { speed: { type: 'number', default: 0.5 } },
      tick: function (time, timeDelta) {
        const rotation = this.el.object3D.rotation;
        rotation.y += this.data.speed * (timeDelta / 1000);
      }
    });

    AFRAME.registerComponent('toggle-visibility-on-click', {
      schema: { target: { type: 'selector' } },
      init: function () {
        const sphereEl = this.el; 
        const targetEl = this.data.target;
        sphereEl.addEventListener('click', () => {
          const isVisible = targetEl.getAttribute('visible');
          targetEl.setAttribute('visible', !isVisible);
        });
      }
    });

    // New play/pause component
    AFRAME.registerComponent('play-pause-video-on-click', {
      schema: { target: { type: 'selector' } },
      init: function () {
        let playing = false;
        const videoEl = this.data.target;

        this.el.addEventListener('click', () => {
          if (!playing) {
            videoEl.play();
            playing = true;
          } else {
            videoEl.pause();
            playing = false;
          }
        });
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <!-- ASSETS: no autoplay here -->
    <a-assets>
      <video
        id="myVideo"
        src="../biomes/video1.mp4"
        loop
        unmuted
        playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <!-- Sky -->
    <a-sky src="../textures/skybiome101.jpg" rotation="0 -130 0"></a-sky>
    
    <!-- Cursor for mouse-based clicks -->
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

    <!-- Toggle sphere -->
    <a-sphere
      id="infoSphere"
      class="clickable"
      color="#FF0000"
      radius="0.4"
      position="-1 1 -3"
      toggle-visibility-on-click="target: #infoPlane"
    ></a-sphere>

    <!-- Info Plane (initially hidden) -->
    <a-plane
      id="infoPlane"
      visible="false"
      class="info-plane"
      position="0 1 -3"
      width="3"
      height="2"
      color="#FFFFFF"
      material="opacity: 0.8"
    >
      <!-- Some text on the plane -->
      <a-text
        value="Here is some info!\nClick sphere again to hide."
        color="#000000"
        align="center"
        width="2.5"
        position="0 0.5 0.01"
      ></a-text>
      
      <!-- Video plane -->
      <a-plane
        id="videoPlane"
        position="0 -0.2 0.01"
        width="2"
        height="1"
        material="shader: flat; src: #myVideo"
      ></a-plane>

      <!-- Play/Pause Button -->
      <a-plane
        id="playButton"
        class="clickable"
        position="0 0.7 0.02"
        width="0.5"
        height="0.2"
        material="color: green"
        play-pause-video-on-click="target: #myVideo"
      >
        <a-text
          value="Play/Pause"
          color="#FFFFFF"
          align="center"
          width="0.9"
          position="0 0 0.01"
        ></a-text>
      </a-plane>
    </a-plane>
  </a-scene>
</body>
</html>
