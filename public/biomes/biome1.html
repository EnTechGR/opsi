<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A-Frame Spheres with Hover Tooltips</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- A-Frame library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- A-Frame Inspector (optional) -->
    <script src="https://unpkg.com/aframe-inspector@latest/dist/aframe-inspector.min.js"></script>

    <script>
      // 1) Self-rotate component (from your original code)
      AFRAME.registerComponent('self-rotate', {
        schema: { speed: { type: 'number', default: 0.5 } },
        tick: function (time, timeDelta) {
          const rotation = this.el.object3D.rotation;
          rotation.y += this.data.speed * (timeDelta / 1000);
        }
      });

      // 2) Toggle-visibility-on-click component (from your original code)
      AFRAME.registerComponent('toggle-visibility-on-click', {
        schema: { target: { type: 'selector' } },
        init: function () {
          const sphereEl = this.el; 
          const targetEl = this.data.target;
          sphereEl.addEventListener('click', () => {
            const isVisible = targetEl.getAttribute('visible');
            targetEl.setAttribute('visible', !isVisible);
          });
        }
      });

      // 3) Play/pause video component (from your original code)
      AFRAME.registerComponent('play-pause-video-on-click', {
        schema: { target: { type: 'selector' } },
        init: function () {
          let playing = false;
          const videoEl = this.data.target;
          this.el.addEventListener('click', () => {
            if (!playing) {
              videoEl.play();
              playing = true;
            } else {
              videoEl.pause();
              playing = false;
            }
          });
        }
      });

      // 4) New show-text-on-hover component
      AFRAME.registerComponent('show-text-on-hover', {
        schema: { 
          target: { type: 'selector' }  // the text entity to show/hide
        },
        init: function () {
          const sphereEl = this.el;
          const textEl = this.data.target;

          sphereEl.addEventListener('mouseenter', () => {
            textEl.setAttribute('visible', true);
          });

          sphereEl.addEventListener('mouseleave', () => {
            textEl.setAttribute('visible', false);
          });
        }
      });
    </script>
  </head>

  <body>
    <a-scene>
      <!-- ASSETS -->
      <a-assets>
        <video
          id="myVideo"
          src="video1.mp4"
          loop
          unmuted
          playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <!-- Sky -->
      <a-sky src="../textures/skybiome101.jpg" rotation="0 -130 0"></a-sky>

      <!-- Cursor for mouse-based clicks + hover events -->
      <a-entity 
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable, .hoverable"
      ></a-entity>

      <!-- EXAMPLE 1: Existing red sphere toggling plane -->
      <a-sphere
        id="infoSphere"
        class="clickable"
        color="#FF0000"
        radius="0.4"
        position="-1 1 -3"
        toggle-visibility-on-click="target: #infoPlane"
      ></a-sphere>

      <!-- Info Plane -->
      <a-plane
        id="infoPlane"
        visible="false"
        position="0 1 -3"
        width="3"
        height="2"
        color="#FFFFFF"
        material="opacity: 0.8"
      >
        <!-- Some text on the plane -->
        <a-text
          value="Here is some info!\nClick sphere again to hide."
          color="#000000"
          align="center"
          width="2.5"
          position="0 0.5 0.01"
        ></a-text>

        <!-- Video plane -->
        <a-plane
          id="videoPlane"
          position="0 -0.2 0.01"
          width="2"
          height="1"
          material="shader: flat; src: #myVideo"
        ></a-plane>

        <!-- Play/Pause Button -->
        <a-plane
          id="playButton"
          class="clickable"
          position="0 0.7 0.02"
          width="0.5"
          height="0.2"
          material="color: green"
          play-pause-video-on-click="target: #myVideo"
        >
          <a-text
            value="Play/Pause"
            color="#FFFFFF"
            align="center"
            width="0.9"
            position="0 0 0.01"
          ></a-text>
        </a-plane>
      </a-plane>

      <!-- EXAMPLE 2: A row of spheres, each with hover text, linked by lines -->
      
      <!-- Sphere 1 -->
      <a-sphere
        id="sphere1"
        class="hoverable"
        radius="0.3"
        color="#42f5ef"
        position="-2 0.5 -3"
        show-text-on-hover="target: #text1"
      ></a-sphere>
      <!-- Sphere 1's hover text (initially hidden) -->
      <a-text
        id="text1"
        value="Hello from Sphere 1!"
        color="white"
        align="center"
        visible="false"
        position="-2 1.2 -3"
      ></a-text>

      <!-- Sphere 2 -->
      <a-sphere
        id="sphere2"
        class="hoverable"
        radius="0.3"
        color="#eb42f5"
        position="0 0.5 -3"
        show-text-on-hover="target: #text2"
      ></a-sphere>
      <!-- Sphere 2's hover text -->
      <a-text
        id="text2"
        value="Hello from Sphere 2!"
        color="white"
        align="center"
        visible="false"
        position="0 1.2 -3"
      ></a-text>

      <!-- Sphere 3 -->
      <a-sphere
        id="sphere3"
        class="hoverable"
        radius="0.3"
        color="#42f55d"
        position="2 0.5 -3"
        show-text-on-hover="target: #text3"
      ></a-sphere>
      <!-- Sphere 3's hover text -->
      <a-text
        id="text3"
        value="Hello from Sphere 3!"
        color="white"
        align="center"
        visible="false"
        position="2 1.2 -3"
      ></a-text>

      <!-- Lines connecting the spheres -->
      <!-- Line from sphere1 to sphere2 -->
      <a-entity line="start: -2 0.5 -3; end: 0 0.5 -3; color: white"></a-entity>
      <!-- Line from sphere2 to sphere3 -->
      <a-entity line="start: 0 0.5 -3; end: 2 0.5 -3; color: white"></a-entity>

    </a-scene>
  </body>
</html>
